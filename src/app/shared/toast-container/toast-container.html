@if (service().notifications().length > 0) {
  <aside class="toast-container" aria-label="Notifications">
    @for (notification of service().notifications(); track notification.id) {
      <div class="toast-slot" [class.toast-slot--exiting]="notification.exiting">
        <div
          class="toast"
          [class.toast--success]="notification.type === 'success'"
          [class.toast--warning]="notification.type === 'warning'"
          [class.toast--error]="notification.type === 'error'"
          [class.toast--exiting]="notification.exiting"
          [attr.role]="notification.type === 'error' ? 'alert' : 'status'"
          [attr.aria-live]="notification.type === 'error' ? 'assertive' : 'polite'"
        >
          <p>{{ notification.message }}</p>
          <button
            type="button"
            class="toast__close"
            [attr.aria-label]="'Dismiss notification: ' + notification.message"
            [disabled]="notification.exiting"
            (click)="dismiss(notification)"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
    }
  </aside>
}
